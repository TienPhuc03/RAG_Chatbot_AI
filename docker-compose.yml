services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragchatbot
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_HOST_AUTH_METHOD: trust

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragchatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./uth_lora_adapter:/models/uth_lora_adapter
      - ./ollama-model:/models/ollama-model
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 15s
      timeout: 5s
      retries: 5

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: rag-embedding
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: intfloat/multilingual-e5-base
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  ragas-service:
    build:
      context: ./ragas-service
      dockerfile: Dockerfile
    container_name: rag-ragas
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      # Gemini API key — cùng key với backend, dùng làm LLM judge cho RAGAS
      GOOGLE_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Gemini LLM judge
      RAGAS_MODEL: ${RAGAS_MODEL:-gemini-2.5-flash}
      # Gemini embedding cho RAGAS
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      RAGAS_GEMINI_EMBEDDING_MODEL: ${RAGAS_GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      RAGAS_GEMINI_EMBEDDING_DIM: ${RAGAS_GEMINI_EMBEDDING_DIM:-768}
      # Retry / timeout / concurrency
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-4}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-60s}
      RAGAS_MAX_WORKERS: ${RAGAS_MAX_WORKERS:-1}
      # Ollama LLM judge
      RAGAS_OLLAMA_BASE_URL: ${RAGAS_OLLAMA_BASE_URL:-http://ollama:11434}
      RAGAS_OLLAMA_MODEL: ${RAGAS_OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
      # Ollama embedding riêng
      RAGAS_OLLAMA_EMBEDDING_MODEL: ${RAGAS_OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
       # Nếu sau này muốn RAGAS dùng embedding-service local
      RAG_EMBEDDING_LOCAL_SERVICE_BASE_URL: ${RAG_EMBEDDING_LOCAL_SERVICE_BASE_URL:-http://embedding-service:8000}
      RAG_EMBEDDING_LOCAL_SERVICE_TIMEOUT: ${RAG_EMBEDDING_LOCAL_SERVICE_TIMEOUT:-30s}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8002/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      ollama:
        condition: service_started
        # khi RAGAS dùng embedding-service local, uncomment dòng dưới để RAGAS chờ embedding-service healthy
      # embedding-service:
      #   condition: service_healthy


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragchatbot
      SPRING_DATASOURCE_USERNAME: raguser
      SPRING_DATASOURCE_PASSWORD: ragpass
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-GEMINI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-30s}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-3}
      RAG_EMBEDDING_DEFAULT_MODEL: ${RAG_EMBEDDING_DEFAULT_MODEL:-GEMINI_EMBEDDING_001}
      RAG_EMBEDDING_PROVIDER_MODE: ${RAG_EMBEDDING_PROVIDER_MODE:-ROUTED}
      RAG_EMBEDDING_LOCAL_SERVICE_BASE_URL: ${RAG_EMBEDDING_LOCAL_SERVICE_BASE_URL:-http://embedding-service:8000}
      RAG_EMBEDDING_LOCAL_SERVICE_TIMEOUT: ${RAG_EMBEDDING_LOCAL_SERVICE_TIMEOUT:-30s}
      BENCHMARK_FINETUNE_OLLAMA_BASE_URL: ${BENCHMARK_FINETUNE_OLLAMA_BASE_URL:-http://ollama:11434}
      BENCHMARK_FINETUNE_OLLAMA_MODEL: ${BENCHMARK_FINETUNE_OLLAMA_MODEL:-hoc-phan-chatbot-finetuned}
      BENCHMARK_FINETUNE_TIMEOUT: ${BENCHMARK_FINETUNE_TIMEOUT:-120s}
      RAGAS_SERVICE_URL: http://ragas-service:8002
      RAGAS_REQUEST_TIMEOUT: 180s
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: hoc-phan-chatbot
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  ollama-data:
