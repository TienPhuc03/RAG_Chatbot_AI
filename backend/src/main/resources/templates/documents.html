<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý tài liệu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container py-4">
    <h2 class="mb-4">📚 Tài liệu môn học</h2>

    <!--FORM UPLOAD: gửi file tới REST POST /api/documents/upload-->
    <div class="card mb-4">
      <div class="card-header fw-bold">Upload tài liệu mới</div>
      <div class="card-body">
        <form
          action="/api/documents/upload"
          method="post"
          enctype="multipart/form-data"
          class="row g-2 align-items-end"
        >
          <div class="col-md-4">
            <label for="fileInput" class="form-label">Chọn file</label>
            <input
              id="fileInput"
              type="file"
              name="file"
              class="form-control"
              accept=".pdf,.docx,.pptx"
              title="Chọn file để tải lên"
              required
            />
          </div>
          <div class="col-md-2">
            <label for="courseCodeInput" class="form-label">Course Code</label>
            <input
              id="courseCodeInput"
              type="text"
              name="courseCode"
              class="form-control"
              th:value="${courseCode}"
              placeholder="Nhập mã học phần"
            />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">
              ⬆ Upload
            </button>
          </div>
        </form>
      </div>
    </div>

    <!--BẢNG DANH SÁCH TÀI LIỆU-->
    <div class="card">
      <div class="card-header fw-bold">
        Danh sách — <span class="text-primary" th:text="${courseCode}"></span>
      </div>
      <div class="card-body p-0">
        <table class="table table-bordered table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>Filename</th>
              <th>Course Code</th>
              <th>Status</th>
              <th>Chunk count</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <!--th:each: lặp qua danh sách documents, mỗi dòng = 1 document-->
            <!--data-doc-id: dùng cho JS polling bên dưới-->
            <tr th:each="doc : ${documents}" th:data-doc-id="${doc.id}">
              <td th:text="${doc.sourceFileName}"></td>
              <td th:text="${doc.courseCode}"></td>
              <td>
                <!--Badge: xanh=INDEXED, vàng=PROCESSING-->
                <span
                  th:classappend="${doc.indexedAt != null} ? 'bg-success' : 'bg-warning'"
                  class="badge"
                  th:text="${doc.indexedAt != null} ? 'INDEXED' : 'PROCESSING'"
                >
                </span>
              </td>
              <!--Số chunk từ Map chunkCounts, mặc định 0 nếu chưa có-->
              <td th:text="${chunkCounts[doc.id] ?: 0}"></td>
              <td>
                <!--
                            Xóa document: form POST với hidden _method=DELETE
                            vì HTML form không hỗ trợ DELETE trực tiếp
                        -->
                <form th:action="'/api/documents/' + ${doc.id}" method="post">
                  <input type="hidden" name="_method" value="DELETE" />
                  <button
                    type="submit"
                    class="btn btn-sm btn-danger"
                    onclick="return confirm('Xóa tài liệu này?');"
                  >
                    🗑 Xóa
                  </button>
                </form>
              </td>
            </tr>
            <!--hiển thị khi chưa có tài liệu -->
            <tr th:if="${#lists.isEmpty(documents)}">
              <td colspan="5" class="text-center text-muted py-3">
                Chưa có tài liệu nào. Hãy upload tài liệu đầu tiên!
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      //Polling: cập nhật badge mỗi 2s cho document đang PROCESSING
      document.querySelectorAll("tr[data-doc-id]").forEach((row) => {
        const badge = row.querySelector(".badge");
        //chỉ polling nếu đang PROCESSING
        if (!badge || badge.textContent.trim() !== "PROCESSING") return;

        const docId = row.dataset.docId;
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`/api/documents/${docId}/status`);
            const data = await res.json();

            //cập nhật text và màu badge theo trạng thái mới
            badge.textContent = data.status;
            badge.className =
              "badge " +
              (data.status === "INDEXED"
                ? "bg-success"
                : data.status === "FAILED"
                  ? "bg-danger"
                  : "bg-warning");

            //dừng polling khi đã có kết quả cuối (INDEXED hoặc FAILED)
            if (data.status === "INDEXED" || data.status === "FAILED") {
              clearInterval(interval);
            }
          } catch (e) {
            console.error("Polling error:", e);
          }
        }, 2000);
      });
    </script>
  </body>
</html>
