spring:
  mvc:
    hiddenmethod:
      filter:
        #cho phép form HTML dùng DELETE/PUT qua hidden field _method
        enabled: true
  application:
    name: rag-chatbot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragchatbot}
    username: ${SPRING_DATASOURCE_USERNAME:raguser}
    password: ${SPRING_DATASOURCE_PASSWORD:ragpass}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

rag:
  embedding:
    default-model: ${RAG_EMBEDDING_DEFAULT_MODEL:GEMINI_EMBEDDING_001}
    provider-mode: ${RAG_EMBEDDING_PROVIDER_MODE:ROUTED}
    local-service:
      base-url: ${RAG_EMBEDDING_LOCAL_SERVICE_BASE_URL:http://localhost:8000}
      timeout: ${RAG_EMBEDDING_LOCAL_SERVICE_TIMEOUT:30s}
    vector-dimensions:
      GEMINI_EMBEDDING_001: ${RAG_EMBEDDING_VECTOR_DIMENSIONS_GEMINI_EMBEDDING_001:3072}
      TEXT_EMBEDDING_3_SMALL: ${RAG_EMBEDDING_VECTOR_DIMENSIONS_TEXT_EMBEDDING_3_SMALL:1536}
      MULTILINGUAL_E5_BASE: ${RAG_EMBEDDING_VECTOR_DIMENSIONS_MULTILINGUAL_E5_BASE:768}
      PHOBERT_BASE: ${RAG_EMBEDDING_VECTOR_DIMENSIONS_PHOBERT_BASE:768}
      BGE_M3: ${RAG_EMBEDDING_VECTOR_DIMENSIONS_BGE_M3:1024}
  vector-store:
    qdrant-host: ${QDRANT_HOST:localhost}
    qdrant-port: ${QDRANT_PORT:6334}
    collection-name: ${QDRANT_COLLECTION_NAME:rag_chunks}
    vector-size: ${QDRANT_VECTOR_SIZE:3072}
    use-tls: ${QDRANT_USE_TLS:false}
    request-timeout: ${QDRANT_REQUEST_TIMEOUT:30s}
  llm:
    provider: ${RAG_LLM_PROVIDER:GEMINI}
  evaluation:
    base-url: ${RAGAS_SERVICE_URL:http://localhost:8002}
    evaluate-path: ${RAGAS_EVALUATE_PATH:/evaluate}
    request-timeout: ${RAGAS_REQUEST_TIMEOUT:300s}
  benchmark:
    finetune:
      ollama-base-url: ${BENCHMARK_FINETUNE_OLLAMA_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      ollama-model: ${BENCHMARK_FINETUNE_OLLAMA_MODEL:hoc-phan-chatbot-finetuned}
      timeout: ${BENCHMARK_FINETUNE_TIMEOUT:120s}

gemini:
  api-key: ${GEMINI_API_KEY:}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  timeout: ${GEMINI_TIMEOUT:30s}
  max-retries: ${GEMINI_MAX_RETRIES:3}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:hoc-phan-chatbot}
