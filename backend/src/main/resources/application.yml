spring:
  mvc:
    hiddenmethod:
      filter:
        #cho phép form HTML dùng DELETE/PUT qua hidden field _method
        enabled: true
  application:
    name: rag-chatbot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragchatbot}
    username: ${SPRING_DATASOURCE_USERNAME:raguser}
    password: ${SPRING_DATASOURCE_PASSWORD:ragpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

rag:
  vector-store:
    qdrant-host: ${QDRANT_HOST:localhost}
    qdrant-port: ${QDRANT_PORT:6333}
    collection-name: ${QDRANT_COLLECTION_NAME:rag_chunks}
    vector-size: ${QDRANT_VECTOR_SIZE:3072}
    use-tls: ${QDRANT_USE_TLS:false}
    request-timeout: ${QDRANT_REQUEST_TIMEOUT:30s}
  evaluation:
    base-url: ${RAGAS_SERVICE_URL:http://localhost:8002}
    evaluate-path: ${RAGAS_EVALUATE_PATH:/evaluate}
    request-timeout: ${RAGAS_REQUEST_TIMEOUT:30s}

gemini:
  api-key: ${GEMINI_API_KEY:}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  timeout: ${GEMINI_TIMEOUT:30s}
  max-retries: ${GEMINI_MAX_RETRIES:3}
